aid: kromatid
name: KromaTiD
description: 'KromaTiD (KROMASURE) is a Boulder, Colorado single-cell analysis life-science
  tools and services company founded in 2016, built around its proprietary directional
  Genomic Hybridization (dGH) platform. dGH probes only the parental strand of DNA,
  which lets it resolve orientation-specific structural variation — inversions, translocations,
  insertions and other complex rearrangements — cell by cell, at resolutions that
  next-generation sequencing and conventional FISH cannot reach. The company sells
  the KROMASURE platform and the dGH in-Site, dGH SCREEN, kBand and PinPoint product
  lines as kits and as lab services, aimed at cell and gene therapy developers who
  need insertional-mutagenesis risk assessment, genotoxicity profiling, edit optimization,
  starting-material and donor qualification, cell-line characterization and batch-release
  testing for CMC and FDA IND submissions. Its work has also been used by NASA for
  spaceflight radiation research. KromaTiD publishes no developer program, no API
  documentation and no machine-readable API contract; its only authenticated surface
  is a Cognidox-backed customer document portal at my.kromatid.com.'
